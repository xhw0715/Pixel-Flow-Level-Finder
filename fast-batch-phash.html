<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fast Batch pHash Generator (Multithreaded)</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 900px;
        margin: 2rem auto;
        padding: 1rem;
      }
      .progress-bar {
        width: 100%;
        height: 30px;
        background: #f0f0f0;
        border-radius: 15px;
        overflow: hidden;
        margin: 1rem 0;
      }
      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #4caf50, #8bc34a);
        transition: width 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
      }
      #results {
        margin-top: 2rem;
        border: 1px solid #ccc;
        padding: 1rem;
        background: #f9f9f9;
        max-height: 300px;
        overflow-y: auto;
      }
      .log-item {
        padding: 0.3rem;
        border-bottom: 1px solid #eee;
        font-family: monospace;
        font-size: 11px;
      }
      button {
        padding: 0.8rem 1.5rem;
        font-size: 16px;
        cursor: pointer;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
      }
      button:hover {
        background: #0056b3;
      }
      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      #json-output {
        margin-top: 1rem;
        padding: 1rem;
        background: #2d2d2d;
        color: #f8f8f2;
        border-radius: 4px;
        font-family: monospace;
        font-size: 12px;
        white-space: pre-wrap;
        max-height: 300px;
        overflow-y: auto;
      }
      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 2rem;
        margin: 1rem 0;
        font-size: 14px;
      }
      .stat-item {
        padding: 0.5rem 1rem;
        background: #e3f2fd;
        border-radius: 4px;
      }
      @media (max-width: 520px) {
        .stats {
          gap: 0.75rem;
        }
        .stat-item {
          flex: 1 1 calc(50% - 0.75rem);
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <h2>⚡ Fast batch RGB three-channel pHash generator (multithreaded)</h2>
    <p>
      Uses multiple Web Workers in parallel for a 4-8x speedup.<br />
      Settings: center crop 75%, 128x128 canvas, 192 hexadecimal characters.
    </p>

    <input
      type="file"
      id="file-input"
      multiple
      accept="image/*"
      style="display: none"
    />
    <button
      id="select-btn"
      onclick="document.getElementById('file-input').click()"
    >
      Select image files
    </button>

    <div class="stats">
      <div class="stat-item">Total: <strong id="total-count">0</strong></div>
      <div class="stat-item">Done: <strong id="done-count">0</strong></div>
      <div class="stat-item">Speed: <strong id="speed">0</strong> images/sec</div>
      <div class="stat-item">ETA: <strong id="eta">--</strong></div>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width: 0%">0%</div>
    </div>

    <div id="results"></div>
    <div id="json-output"></div>

    <script>
      const fileInput = document.getElementById("file-input");
      const selectBtn = document.getElementById("select-btn");
      const resultsDiv = document.getElementById("results");
      const jsonOutput = document.getElementById("json-output");
      const progressFill = document.getElementById("progress-fill");
      const totalCountEl = document.getElementById("total-count");
      const doneCountEl = document.getElementById("done-count");
      const speedEl = document.getElementById("speed");
      const etaEl = document.getElementById("eta");

      // Create the Web Worker code.
      const workerCode = `
        self.onmessage = function(e) {
          const { redPixels, greenPixels, bluePixels, size, levelId } = e.data;
          
          const hashR = calculatePHash(redPixels, size);
          const hashG = calculatePHash(greenPixels, size);
          const hashB = calculatePHash(bluePixels, size);
          
          const hash = hashR + hashG + hashB;
          self.postMessage({ hash, levelId });
        };

        function calculatePHash(pixels, size) {
          const dctData = applyDCT(pixels, size);
          
          const rows = 16;
          const cols = 16;
          let lowFreq = [];
          for (let u = 0; u < rows; u++) {
            for (let v = 0; v < cols; v++) {
              lowFreq.push(dctData[u * size + v]);
            }
          }

          const average = lowFreq.reduce((a, b) => a + b, 0) / lowFreq.length;
          const binaryHash = lowFreq.map(v => (v > average ? "1" : "0")).join("");
          
          let hexHash = "";
          for (let i = 0; i < binaryHash.length; i += 4) {
            const chunk = binaryHash.substr(i, 4);
            hexHash += parseInt(chunk, 2).toString(16);
          }
          
          return hexHash;
        }

        function applyDCT(f, N) {
          const F = new Float32Array(N * N);
          const pi_N = Math.PI / (2 * N);

          for (let u = 0; u < N; u++) {
            for (let v = 0; v < N; v++) {
              let sum = 0;
              for (let x = 0; x < N; x++) {
                for (let y = 0; y < N; y++) {
                  sum += f[x * N + y] * Math.cos((2 * x + 1) * u * pi_N) * Math.cos((2 * y + 1) * v * pi_N);
                }
              }
              const alphaU = u === 0 ? Math.sqrt(1 / N) : Math.sqrt(2 / N);
              const alphaV = v === 0 ? Math.sqrt(1 / N) : Math.sqrt(2 / N);
              F[u * N + v] = alphaU * alphaV * sum;
            }
          }
          return F;
        }
      `;

      // Create multiple Workers based on the CPU core count.
      const workerCount = navigator.hardwareConcurrency || 4;
      const workers = [];
      const blob = new Blob([workerCode], { type: "application/javascript" });

      for (let i = 0; i < workerCount; i++) {
        workers.push({
          worker: new Worker(URL.createObjectURL(blob)),
          busy: false,
        });
      }

      const hashes = {};
      let processedCount = 0;
      let totalFiles = 0;
      let startTime = 0;
      let taskQueue = [];

      fileInput.onchange = async (e) => {
        const files = Array.from(e.target.files);
        totalFiles = files.length;
        processedCount = 0;
        startTime = Date.now();

        totalCountEl.textContent = totalFiles;
        doneCountEl.textContent = 0;
        selectBtn.disabled = true;

        resultsDiv.innerHTML = "<h3>Processing...</h3>";
        jsonOutput.innerHTML = "";

        // Queue every selected image.
        taskQueue = [];
        for (const file of files) {
          taskQueue.push(file);
        }

        // Start every Worker.
        workers.forEach((w) => processNext(w));

        fileInput.value = "";
      };

      function processNext(workerObj) {
        if (taskQueue.length === 0) {
          workerObj.busy = false;
          // Check whether all files are complete.
          if (processedCount === totalFiles) {
            displayJSON();
            selectBtn.disabled = false;
          }
          return;
        }

        const file = taskQueue.shift();
        workerObj.busy = true;

        const levelId = file.name.replace(/\.(jpg|jpeg|png|gif)$/i, "");
        const reader = new FileReader();

        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            processImage(img, levelId, workerObj);
          };
          img.src = event.target.result;
        };

        reader.readAsDataURL(file);
      }

      function processImage(img, levelId, workerObj) {
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const size = 128;
        canvas.width = size;
        canvas.height = size;

        // Adaptive center crop.
        const sw = img.width;
        const sh = img.height;
        const cropRatio = 0.75;
        const cropW = sw * cropRatio;
        const cropH = sh * cropRatio;
        const sx = (sw - cropW) / 2;
        const sy = (sh - cropH) / 2;

        ctx.drawImage(img, sx, sy, cropW, cropH, 0, 0, size, size);

        // Read the RGB channel data.
        const imageData = ctx.getImageData(0, 0, size, size).data;
        const redPixels = new Float32Array(size * size);
        const greenPixels = new Float32Array(size * size);
        const bluePixels = new Float32Array(size * size);

        for (let i = 0; i < imageData.length; i += 4) {
          const idx = i / 4;
          redPixels[idx] = imageData[i];
          greenPixels[idx] = imageData[i + 1];
          bluePixels[idx] = imageData[i + 2];
        }

        // Send the pixel data to the Worker.
        workerObj.worker.postMessage({
          redPixels: redPixels,
          greenPixels: greenPixels,
          bluePixels: bluePixels,
          size: size,
          levelId: levelId,
        });
      }

      // Set up message handlers for every Worker.
      workers.forEach((workerObj) => {
        workerObj.worker.onmessage = function (e) {
          const { hash, levelId } = e.data;

          hashes[levelId] = hash;
          processedCount++;

          // Update progress.
          const progress = (processedCount / totalFiles) * 100;
          progressFill.style.width = progress + "%";
          progressFill.textContent = Math.round(progress) + "%";

          doneCountEl.textContent = processedCount;

          // Calculate speed and remaining time.
          const elapsed = (Date.now() - startTime) / 1000;
          const speed = (processedCount / elapsed).toFixed(1);
          speedEl.textContent = speed;

          const remaining = totalFiles - processedCount;
          const eta = remaining / speed;
          etaEl.textContent = eta > 0 ? Math.ceil(eta) + " sec" : "Done";

          // Show the log entry.
          const logItem = document.createElement("div");
          logItem.className = "log-item";
          logItem.textContent = `✓ [${processedCount}/${totalFiles}] ${levelId}`;
          resultsDiv.appendChild(logItem);
          resultsDiv.scrollTop = resultsDiv.scrollHeight;

          // Process the next task.
          processNext(workerObj);
        };
      });

      function displayJSON() {
        // Sort by level number.
        const sortedHashes = Object.keys(hashes)
          .sort((a, b) => {
            const numA = parseInt(a.replace(/\D/g, "")) || 0;
            const numB = parseInt(b.replace(/\D/g, "")) || 0;
            return numA - numB;
          })
          .reduce((obj, key) => {
            obj[key] = hashes[key];
            return obj;
          }, {});

        const json = JSON.stringify(sortedHashes, null, 2);
        jsonOutput.innerHTML = `<strong>✅ Generation complete (copy or use the automatic download).</strong>\n\n${json}`;

        // Download the JSON automatically.
        const dataStr =
          "data:text/json;charset=utf-8," + encodeURIComponent(json);
        const downloadAnchor = document.createElement("a");
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "level-hashes.json");
        downloadAnchor.click();

        console.log(`✅ Done. Processed ${Object.keys(hashes).length} images.`);
      }
    </script>
  </body>
</html>
