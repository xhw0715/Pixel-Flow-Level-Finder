<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>网页内容语音播报（支持切换播报员）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            padding: 30px;
            font-family: Arial, sans-serif;
        }
        #speakBox {
            max-width: 800px;
            margin: 20px auto;
            padding: 25px;
            border: 1px solid #eee;
            border-radius: 10px;
            line-height: 1.8;
        }
        .child-box {
            margin: 15px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
        }
        .controls {
            max-width: 800px;
            margin: 20px auto;
            text-align: center;
        }
        select {
            padding: 8px 12px;
            margin: 0 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        .tip {
            text-align: center;
            margin-top: 10px;
            color: #409eff;
        }
    </style>
</head>
<body>
    <div class="controls">
        <label for="voiceSelect">选择播报员：</label>
        <select id="voiceSelect"></select>
    </div>

    <div id="speakBox">
        <h2>主标题：网页语音播报演示</h2>
        <p>这是父盒子里的文本，会被完整播报</p>
        <div class="child-box">
            <span>这是第一层子盒子的文本</span>
            <div class="child-box">
                <b>这是第二层嵌套子盒子的文本</b>
                <p>这是第三层嵌套的内容，全部都会被读取！</p>
            </div>
        </div>
        <p>接口返回的动态文字、静态文字都支持</p>
    </div>

    <div class="tip" id="tip">页面加载完成，点击页面任意位置开始播报</div>

<script>
    // 1. 获取DOM元素
    const speakBox = document.getElementById('speakBox');
    const voiceSelect = document.getElementById('voiceSelect');
    const tip = document.getElementById('tip');
    const synth = window.speechSynthesis;
    let speakText = '';
    let voices = [];

    // 2. 页面加载完成后获取文本内容
    document.addEventListener('DOMContentLoaded', function() {
        speakText = speakBox.innerText.trim();
        
        if (!speakText) {
            tip.textContent = '未获取到可播报内容';
            return;
        }

        // 3. 监听语音列表加载完成事件（关键）
        synth.onvoiceschanged = function() {
            voices = synth.getVoices();
            populateVoiceList(); // 填充语音选择下拉框
        };

        // 4. 监听用户点击触发播报
        function startSpeak() {
            tip.textContent = '开始语音播报...';
            playVoice(speakText);
            document.removeEventListener('click', startSpeak);
        }
        document.addEventListener('click', startSpeak);
    });

    // 5. 填充语音选择下拉框
    function populateVoiceList() {
        // 清空下拉框
        voiceSelect.innerHTML = '';

        // 筛选中文语音（可选，可根据需求调整）
        const chineseVoices = voices.filter(voice => 
            voice.lang === 'zh-CN' || voice.name.includes('Chinese')
        );

        // 添加默认选项
        const defaultOption = document.createElement('option');
        defaultOption.textContent = '请选择播报员';
        defaultOption.value = '';
        voiceSelect.appendChild(defaultOption);

        // 添加所有中文语音选项
        chineseVoices.forEach((voice, index) => {
            const option = document.createElement('option');
            option.textContent = `${voice.name} (${voice.lang}) - ${voice.gender || '未知性别'}`;
            option.value = index;
            voiceSelect.appendChild(option);
        });
    }

    // 6. 语音播报核心函数（支持选择播报员）
    function playVoice(text) {
        if (!text) return;
        
        synth.cancel(); // 停止之前的播报

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = 1;       // 语速 0.5~2
        utterance.volume = 1;     // 音量 0~1

        // 7. 选择用户指定的播报员（如果有选择）
        const selectedVoiceIndex = voiceSelect.value;
        if (selectedVoiceIndex !== '' && voices.length > 0) {
            utterance.voice = voices[selectedVoiceIndex];
        }

        // 开始播报
        synth.speak(utterance);

        // 播报完成回调
        utterance.onend = function() {
            tip.textContent = '✅ 语音播报完成';
        };
    }
</script>
</body>
</html>
